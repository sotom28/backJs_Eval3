services:
  mysql:
    image: mysql:8.0
    container_name: mysql-backjs
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: eval3_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_backjs:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-p`echo $MYSQL_ROOT_PASSWORD`"] # 
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s 

  backjs:
    build:
      context: .
    container_name: backjs-eval3
    restart: on-failure #
    ports:
      - "8081:8081"
    environment:
      PORT: 8081
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: eval3_db
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_backjs:
